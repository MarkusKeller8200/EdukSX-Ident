name: Verbesserung vorschlagen
description: Eine bestehende Funktion soll besser, einfacher oder schneller werden.
title: "Verbesserung: "
labels: ["verbesserung", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Ablauf:** Neue Meldungen erhalten das Label `triage` und werden geprüft. Erst die ausdrückliche
        Freigabe (Label `_1 bereit`, Projektverantwortliche:r) macht daraus einen Entwicklungsauftrag.

        **Datenschutz:** Keine echten Personendaten, Zugangsdaten oder Bildschirmfotos mit Personendaten anhängen.
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Allgemein
        - Oberfläche
        - Schnittstelle / API
        - Anmeldung / Rechte
        - Dokumentation
        - Betrieb / Deployment
        - anderes
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Wie ist es heute?
      description: Was stört oder ist umständlich?
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: Wie sollte es sein?
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Wer profitiert?
      description: Wer ist betroffen, und wie oft kommt es vor?
